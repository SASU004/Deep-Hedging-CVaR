version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"

